[tox]
envlist=py{311,312,313,py3.10}-{test,style}

[testenv]
distribute=False
whitelist_externals =
  manage

setenv =
  PYTHONHASHSEED=94967295
  PYTHONWARNINGS=all
  PIP_CACHE_DIR={toxworkdir}/.pip/packages
  PIP_WHEEL_DIR={toxworkdir}/.pip/wheels
  PIP_FIND_LINKS=file://{toxworkdir}/.pip/wheels

commands =
  test: manage test
  style: manage lint

deps =
  -r{toxinidir}/dev-requirements.txt
  -r{toxinidir}/requirements.txt
  py{311,312,313}: -r{toxinidir}/optional-requirements.txt
