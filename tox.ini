[tox]
toxworkdir={homedir}/.tox/venvcache/mezmorize
envlist=py{311,312,313,py3}-{test,style}

[testenv]
distribute=False
whitelist_externals =
  manage

setenv =
  PYTHONHASHSEED=94967295
  PYTHONWARNINGS=all
  PIP_CACHE_DIR={homedir}/.pip/packages
  PIP_WHEEL_DIR={homedir}/.pip/wheels
  PIP_FIND_LINKS=file://{homedir}/.pip/wheels

commands =
  py{311,py3}-{style}: true
  test: manage test
  style: manage lint

deps =
  -r{toxinidir}/dev-requirements.txt
  -r{toxinidir}/requirements.txt
  py{311,312,313}: -r{toxinidir}/optional-requirements.txt
